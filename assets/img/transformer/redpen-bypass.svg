<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Teacher's red pen analogy for residual connections: original student work x is carried forward, while the layer F(x) is added like red-pen corrections on top">
  <defs>
    <filter id="redpen-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#14121F" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="#FBF8F3"/>
  <rect x="20" y="20" width="760" height="440" rx="20" fill="none" stroke="#E7E1D6" stroke-width="2"/>

  <!-- Title Banner -->
  <rect x="50" y="38" width="700" height="46" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="75" y="67" font-family="Fraunces, Georgia, serif" font-size="18" font-weight="600" fill="#DC2626">THE RED-PEN BYPASS: RESIDUAL CONNECTIONS (x + F(x))</text>

  <!-- Main Card Scene Container -->
  <g transform="translate(50, 96)" filter="url(#redpen-shadow)">
    <rect x="0" y="0" width="700" height="348" rx="16" fill="#FFFFFF" stroke="#E7E1D6" stroke-width="2.5"/>

    <!-- Left: Original Student Paper (x) in standard ink -->
    <g transform="translate(35, 20)">
      <rect x="0" y="0" width="220" height="215" rx="12" fill="#FBF8F3" stroke="#CBD5E1" stroke-width="2"/>
      <text x="110" y="28" font-family="Fraunces, Georgia, serif" font-size="16" font-weight="600" fill="#1E1B2E" text-anchor="middle">Student Answer Sheet (x)</text>
      <line x1="20" y1="42" x2="200" y2="42" stroke="#CBD5E1" stroke-width="1.5"/>

      <!-- Ruled lines representing student writing -->
      <line x1="20" y1="70" x2="180" y2="70" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="25" y="92" font-family="'JetBrains Mono', monospace" font-size="14" fill="#475569">Original text &amp; features</text>
      <line x1="20" y1="108" x2="195" y2="108" stroke="#E2E8F0" stroke-width="1.5"/>
      <line x1="20" y1="134" x2="160" y2="134" stroke="#E2E8F0" stroke-width="1.5"/>

      <!-- Dashed separator inside the box -->
      <line x1="20" y1="158" x2="200" y2="158" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Green note pill: fully padded and safely inside the box -->
      <rect x="15" y="170" width="190" height="30" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
      <text x="110" y="190" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#15803D" text-anchor="middle">&#10003; Never discarded or rubbed out</text>
    </g>

    <!-- Clear Label: Placed high at y=24, completely clear of the curve below -->
    <text x="405" y="24" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#1E1B2E" text-anchor="middle">
      Express Lane: Original paper (x) carried forward
    </text>

    <!-- One Continuous Smooth Curve from (255, 95) to (550, 122) -->
    <path d="M 255 95 C 350 48, 550 48, 550 122" fill="none" stroke="#1E1B2E" stroke-width="3" stroke-linecap="round"/>
    <!-- Proper Arrowhead landing cleanly on top of (+) circle at (550, 134) -->
    <polygon points="550,134 543,121 557,121" fill="#1E1B2E"/>

    <!-- Input arrow into F(x) from Student Answer Sheet -->
    <line x1="255" y1="158" x2="280" y2="158" stroke="#1E1B2E" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="288,158 277,153 277,163" fill="#1E1B2E"/>

    <!-- Center: The Processing Block F(x) is the RED-PEN CORRECTION -->
    <rect x="290" y="120" width="195" height="76" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
    <text x="387" y="150" font-family="Fraunces, Georgia, serif" font-size="16" font-weight="600" fill="#DC2626" text-anchor="middle">Teacher&#8217;s Red Pen F(x)</text>
    <text x="387" y="174" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#991B1B" text-anchor="middle">Attention or MLP Correction</text>

    <!-- Red-pen correction arrow leaving F(x) and entering (+) circle -->
    <line x1="485" y1="158" x2="516" y2="158" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
    <polygon points="525,158 513,152 513,164" fill="#DC2626"/>

    <!-- Addition / Correction Node (+) at (550, 158) with radius 22 -->
    <circle cx="550" cy="158" r="22" fill="#FFFFFF" stroke="#DC2626" stroke-width="3.5"/>
    <text x="550" y="166" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="bold" fill="#DC2626" text-anchor="middle">+</text>

    <!-- Output arrow from (+) node to combined result box -->
    <line x1="572" y1="158" x2="618" y2="158" stroke="#1E1B2E" stroke-width="3" stroke-linecap="round"/>
    <polygon points="626,158 614,152 614,164" fill="#1E1B2E"/>

    <!-- Right: Combined Result Output -->
    <rect x="628" y="134" width="58" height="48" rx="8" fill="#1E1B2E"/>
    <text x="657" y="164" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">x+F(x)</text>

    <!-- Generous Space Before Bottom Caption -->
    <rect x="35" y="265" width="630" height="58" rx="8" fill="#F8FAFC" stroke="#E7E1D6" stroke-width="1.5"/>
    <text x="350" y="290" font-family="'Inter', sans-serif" font-size="14" fill="#1E1B2E" text-anchor="middle">
      A teacher doesn&#8217;t tear up your essay: she marks small corrections in red pen on top.
    </text>
    <text x="350" y="312" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#DC2626" text-anchor="middle">
      Layer Output = x (original work) + F(x) (red-pen addition)
    </text>
  </g>
</svg>
