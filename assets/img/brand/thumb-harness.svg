<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Motorcycle frame with engine being fitted into chassis representing harness and model">
  <defs>
    <pattern id="hn-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#0F766E" opacity="0.12"/>
      <circle cx="0" cy="0" r="1" fill="#0F766E" opacity="0.08"/>
      <circle cx="32" cy="0" r="1" fill="#0F766E" opacity="0.08"/>
      <circle cx="0" cy="32" r="1" fill="#0F766E" opacity="0.08"/>
      <circle cx="32" cy="32" r="1" fill="#0F766E" opacity="0.08"/>
    </pattern>
    <linearGradient id="hn-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="640" fill="#F4F8F7"/>
  <rect width="960" height="640" fill="url(#hn-glow)"/>
  <rect width="960" height="640" fill="url(#hn-grid)"/>

  <!-- Outer Blueprint Frame -->
  <rect x="32" y="32" width="896" height="576" rx="20" fill="none" stroke="#D3E5E3" stroke-width="2"/>

  <!-- Motorcycle Wheels (Geometric) -->
  <!-- Rear Wheel (Left) -->
  <g transform="translate(220, 420)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#1E1B2E" stroke-width="8"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#0F766E" stroke-width="3" opacity="0.4"/>
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <!-- Spokes -->
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#0F766E" stroke-width="2" opacity="0.3"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#0F766E" stroke-width="2" opacity="0.3"/>
    <line x1="-56" y1="-56" x2="56" y2="56" stroke="#0F766E" stroke-width="2" opacity="0.3"/>
    <line x1="-56" y1="56" x2="56" y2="-56" stroke="#0F766E" stroke-width="2" opacity="0.3"/>
    <!-- Brake disc & caliper (Brakes = Permissions) -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#0F766E" stroke-width="3" stroke-dasharray="8,6"/>
    <rect x="25" y="-35" width="28" height="38" rx="6" fill="#0F766E"/>
    <text x="39" y="-12" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">BRAKE</text>
  </g>

  <!-- Front Wheel (Right) -->
  <g transform="translate(740, 420)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#1E1B2E" stroke-width="8"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#0F766E" stroke-width="3" opacity="0.4"/>
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <line x1="-80" y1="0" x2="80" y2="0" stroke="#0F766E" stroke-width="2" opacity="0.3"/>
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#0F766E" stroke-width="2" opacity="0.3"/>
    <line x1="-56" y1="-56" x2="56" y2="56" stroke="#0F766E" stroke-width="2" opacity="0.3"/>
    <line x1="-56" y1="56" x2="56" y2="-56" stroke="#0F766E" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Motorcycle Chassis / Frame (The Harness) -->
  <!-- Swingarm to rear hub -->
  <line x1="220" y1="420" x2="380" y2="400" stroke="#1E1B2E" stroke-width="8" stroke-linecap="round"/>
  <!-- Main Backbone Frame -->
  <path d="M 220 420 L 320 280 L 480 220 L 650 210 L 740 420" fill="none" stroke="#1E1B2E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 380 400 L 480 220" stroke="#1E1B2E" stroke-width="6" stroke-linecap="round"/>
  <path d="M 320 280 L 380 420 L 590 420 L 650 210" fill="none" stroke="#1E1B2E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Front Fork -->
  <line x1="650" y1="210" x2="740" y2="420" stroke="#0F766E" stroke-width="8" stroke-linecap="round"/>

  <!-- Handlebars (Tools: read, edit, run) -->
  <g transform="translate(640, 160)">
    <path d="M -30 20 L 10 -10 L 40 -12" fill="none" stroke="#0F766E" stroke-width="6" stroke-linecap="round"/>
    <circle cx="40" cy="-12" r="8" fill="#0F766E"/>
    <!-- Callout badge -->
    <rect x="55" y="-30" width="130" height="34" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.5"/>
    <text x="120" y="-8" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">Tools (Hands)</text>
  </g>

  <!-- Dashboard Gauge (Context) -->
  <g transform="translate(610, 150)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/>
    <path d="M -12 6 A 15 15 0 1 1 12 6" fill="none" stroke="#0F766E" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="7" y2="-10" stroke="#F4A62A" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Badge -->
    <rect x="-140" y="-35" width="125" height="34" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.5"/>
    <text x="-78" y="-13" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">Context Window</text>
  </g>

  <!-- THE ENGINE: Lowering into chassis (The Model) -->
  <g transform="translate(485, 335)">
    <!-- Lowering Guide Lines -->
    <line x1="-90" y1="-120" x2="-90" y2="-45" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="90" y1="-120" x2="90" y2="-45" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="6,4"/>
    <polygon points="-90,-40 -95,-52 -85,-52" fill="#0F766E"/>
    <polygon points="90,-40 85,-52 95,-52" fill="#0F766E"/>

    <!-- Engine Casting -->
    <rect x="-95" y="-45" width="190" height="135" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <!-- Cooling Fins -->
    <line x1="-75" y1="-20" x2="75" y2="-20" stroke="#0F766E" stroke-width="3"/>
    <line x1="-75" y1="0" x2="75" y2="0" stroke="#0F766E" stroke-width="3"/>
    <line x1="-75" y1="20" x2="75" y2="20" stroke="#0F766E" stroke-width="3"/>
    <line x1="-75" y1="40" x2="75" y2="40" stroke="#0F766E" stroke-width="3"/>

    <!-- Cylinder Head Badge -->
    <rect x="-70" y="-75" width="140" height="35" rx="8" fill="#0F766E"/>
    <text x="0" y="-53" font-family="Fraunces, serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">The Model (Engine)</text>

    <!-- Crankcase emblem -->
    <circle cx="0" cy="55" r="22" fill="#E6FFFA" stroke="#0F766E" stroke-width="3"/>
    <text x="0" y="60" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0F766E" text-anchor="middle">AI</text>
  </g>

  <!-- Service Book (Memory) Left Rear -->
  <g transform="translate(320, 280)">
    <rect x="-45" y="-55" width="55" height="40" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.5"/>
    <line x1="-35" y1="-42" x2="-5" y2="-42" stroke="#0F766E" stroke-width="2"/>
    <line x1="-35" y1="-32" x2="-10" y2="-32" stroke="#0F766E" stroke-width="2"/>
    <line x1="-35" y1="-22" x2="-18" y2="-22" stroke="#0F766E" stroke-width="2"/>
    <rect x="-115" y="-100" width="125" height="34" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.5"/>
    <text x="-52" y="-78" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0F766E" text-anchor="middle">Memory Log</text>
  </g>

  <!-- Accent Bar Top -->
  <rect x="0" y="0" width="960" height="8" fill="#0F766E"/>
</svg>
