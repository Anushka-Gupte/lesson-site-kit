<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Motorcycle frame with engine being fitted into chassis representing harness and model">
  <defs>
    <pattern id="hn-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#0F766E" opacity="0.12"/>
      <circle cx="0" cy="0" r="1.5" fill="#0F766E" opacity="0.08"/>
      <circle cx="40" cy="0" r="1.5" fill="#0F766E" opacity="0.08"/>
      <circle cx="0" cy="40" r="1.5" fill="#0F766E" opacity="0.08"/>
      <circle cx="40" cy="40" r="1.5" fill="#0F766E" opacity="0.08"/>
    </pattern>
    <linearGradient id="hn-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="640" fill="#F4F8F7"/>
  <rect width="960" height="640" fill="url(#hn-glow)"/>
  <rect width="960" height="640" fill="url(#hn-grid)"/>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="960" height="10" fill="#0F766E"/>

  <!-- Outer Blueprint Frame -->
  <rect x="36" y="36" width="888" height="568" rx="24" fill="none" stroke="#D3E5E3" stroke-width="3"/>

  <!-- Single prominent label: font-size 44, centered in clear open space -->
  <text x="480" y="115" font-family="Fraunces, ui-serif, Georgia, serif" font-size="44" font-weight="600" fill="#0F766E" text-anchor="middle" letter-spacing="-0.01em">HARNESS</text>

  <!-- Rear Wheel (Left) - Clean Geometry, Zero Text Overlap -->
  <g transform="translate(200, 430)">
    <circle cx="0" cy="0" r="115" fill="none" stroke="#1E1B2E" stroke-width="12"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#0F766E" stroke-width="3" opacity="0.4"/>
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" stroke="#0F766E" stroke-width="5"/>
    <!-- Spokes -->
    <line x1="-85" y1="0" x2="85" y2="0" stroke="#0F766E" stroke-width="2.5" opacity="0.4"/>
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#0F766E" stroke-width="2.5" opacity="0.4"/>
    <line x1="-60" y1="-60" x2="60" y2="60" stroke="#0F766E" stroke-width="2.5" opacity="0.4"/>
    <line x1="-60" y1="60" x2="60" y2="-60" stroke="#0F766E" stroke-width="2.5" opacity="0.4"/>
    <!-- Brake Rotor and Caliper Icon (Brakes / Permissions) -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#0F766E" stroke-width="4" stroke-dasharray="10,6"/>
    <rect x="30" y="-35" width="28" height="42" rx="8" fill="#0F766E"/>
  </g>

  <!-- Front Wheel (Right) -->
  <g transform="translate(760, 430)">
    <circle cx="0" cy="0" r="115" fill="none" stroke="#1E1B2E" stroke-width="12"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#0F766E" stroke-width="3" opacity="0.4"/>
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" stroke="#0F766E" stroke-width="5"/>
    <line x1="-85" y1="0" x2="85" y2="0" stroke="#0F766E" stroke-width="2.5" opacity="0.4"/>
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#0F766E" stroke-width="2.5" opacity="0.4"/>
    <line x1="-60" y1="-60" x2="60" y2="60" stroke="#0F766E" stroke-width="2.5" opacity="0.4"/>
    <line x1="-60" y1="60" x2="60" y2="-60" stroke="#0F766E" stroke-width="2.5" opacity="0.4"/>
  </g>

  <!-- Motorcycle Frame Chassis (The Harness) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Swingarm to rear axle -->
    <line x1="200" y1="430" x2="350" y2="410" stroke="#1E1B2E" stroke-width="10"/>
    <!-- Main spine frame -->
    <path d="M 200 430 L 300 300 L 480 230 L 670 220 L 760 430" fill="none" stroke="#1E1B2E" stroke-width="10"/>
    <!-- Engine Cradle tubes -->
    <path d="M 300 300 L 350 450 L 600 450 L 670 220" fill="none" stroke="#1E1B2E" stroke-width="8"/>
    <line x1="350" y1="410" x2="480" y2="230" stroke="#1E1B2E" stroke-width="7"/>
    <!-- Front Fork (Teal Accent) -->
    <line x1="670" y1="220" x2="760" y2="430" stroke="#0F766E" stroke-width="10"/>
  </g>

  <!-- Handlebars & Tool Icons (Hands) -->
  <g transform="translate(660, 160)">
    <path d="M -40 30 L 10 -15 L 50 -15" fill="none" stroke="#0F766E" stroke-width="8" stroke-linecap="round"/>
    <circle cx="50" cy="-15" r="10" fill="#0F766E"/>
    <!-- Wrench Tool Glyph -->
    <circle cx="95" cy="-15" r="22" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <path d="M 87 -23 L 95 -15 L 103 -23 M 95 -15 L 95 -3" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Dashboard Gauge Icon (Context) -->
  <g transform="translate(620, 160)">
    <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <path d="M -15 8 A 18 18 0 1 1 15 8" fill="none" stroke="#0F766E" stroke-width="3"/>
    <line x1="0" y1="0" x2="10" y2="-12" stroke="#F4A62A" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Service Logbook Icon (Memory) -->
  <g transform="translate(290, 240)">
    <rect x="-30" y="-36" width="60" height="48" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <line x1="-18" y1="-22" x2="18" y2="-22" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
    <line x1="-18" y1="-12" x2="18" y2="-12" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
    <line x1="-18" y1="-2" x2="6" y2="-2" stroke="#0F766E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- THE ENGINE: Lowering into frame (The Model) -->
  <g transform="translate(480, 360)">
    <!-- Lowering Guide Lines & Arrows -->
    <line x1="-100" y1="-125" x2="-100" y2="-50" stroke="#0F766E" stroke-width="3.5" stroke-dasharray="8,6"/>
    <line x1="100" y1="-125" x2="100" y2="-50" stroke="#0F766E" stroke-width="3.5" stroke-dasharray="8,6"/>
    <polygon points="-100,-42 -108,-56 -92,-56" fill="#0F766E"/>
    <polygon points="100,-42 92,-56 108,-56" fill="#0F766E"/>

    <!-- Cylinder Head -->
    <rect x="-80" y="-80" width="160" height="36" rx="10" fill="#0F766E"/>

    <!-- Main Engine Casting -->
    <rect x="-105" y="-44" width="210" height="150" rx="20" fill="#FFFFFF" stroke="#0F766E" stroke-width="5"/>

    <!-- Bold Cooling Fins -->
    <line x1="-80" y1="-18" x2="80" y2="-18" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>
    <line x1="-80" y1="4" x2="80" y2="4" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>
    <line x1="-80" y1="26" x2="80" y2="26" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>
    <line x1="-80" y1="48" x2="80" y2="48" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>

    <!-- Crankcase Medallion -->
    <circle cx="0" cy="74" r="22" fill="#E6FFFA" stroke="#0F766E" stroke-width="4"/>
    <circle cx="0" cy="74" r="8" fill="#F4A62A"/>
  </g>
</svg>
