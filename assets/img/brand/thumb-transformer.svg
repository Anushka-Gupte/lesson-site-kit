<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Transformer architecture showing tokens and attention arcs connecting words">
  <defs>
    <!-- Background pattern: subtle geometric rangoli dots -->
    <pattern id="tr-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#4338CA" opacity="0.12"/>
      <circle cx="0" cy="0" r="1" fill="#4338CA" opacity="0.08"/>
      <circle cx="32" cy="0" r="1" fill="#4338CA" opacity="0.08"/>
      <circle cx="0" cy="32" r="1" fill="#4338CA" opacity="0.08"/>
      <circle cx="32" cy="32" r="1" fill="#4338CA" opacity="0.08"/>
    </pattern>
    <linearGradient id="tr-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4338CA" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="640" fill="#F6F3ED"/>
  <rect width="960" height="640" fill="url(#tr-glow)"/>
  <rect width="960" height="640" fill="url(#tr-dots)"/>

  <!-- Outer Frame -->
  <rect x="32" y="32" width="896" height="576" rx="20" fill="none" stroke="#E5DFD3" stroke-width="2"/>

  <!-- Top Stage: Output Prediction -->
  <g transform="translate(480, 110)">
    <!-- Probability bars -->
    <rect x="-190" y="-30" width="380" height="60" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="3"/>
    <text x="-160" y="6" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#1E1B2E">Next Word: "late"</text>
    <rect x="30" y="-12" width="120" height="24" rx="6" fill="#EEF2FF"/>
    <rect x="30" y="-12" width="76" height="24" rx="6" fill="#4338CA"/>
    <text x="114" y="5" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#4338CA">40%</text>
  </g>

  <!-- Connection to MLP -->
  <line x1="480" y1="140" x2="480" y2="180" stroke="#4338CA" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="480,186 474,174 486,174" fill="#4338CA"/>

  <!-- Stacked Decoder Tile: Feed Forward -->
  <g transform="translate(480, 220)">
    <rect x="-170" y="-32" width="340" height="64" rx="14" fill="#FFFFFF" stroke="#4338CA" stroke-width="3.5"/>
    <circle cx="-130" cy="0" r="12" fill="#EEF2FF" stroke="#4338CA" stroke-width="2.5"/>
    <path d="M-135 0 L-125 0 M-130 -5 L-130 5" stroke="#4338CA" stroke-width="2.5" stroke-linecap="round"/>
    <text x="-102" y="6" font-family="Fraunces, serif" font-size="20" font-weight="600" fill="#1E1B2E">Feed-Forward Network (MLP)</text>
  </g>

  <!-- Residual Bypass Right -->
  <path d="M 310 380 Q 250 300 310 220" fill="none" stroke="#4338CA" stroke-width="3" stroke-dasharray="6,6"/>
  <circle cx="280" cy="300" r="14" fill="#FFFFFF" stroke="#4338CA" stroke-width="2.5"/>
  <text x="280" y="304" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#4338CA" text-anchor="middle">+</text>

  <!-- Connection between MLP and Attention -->
  <line x1="480" y1="252" x2="480" y2="295" stroke="#4338CA" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="480,260 474,272 486,272" fill="#4338CA"/>

  <!-- Stacked Decoder Tile: Masked Multi-Head Attention -->
  <g transform="translate(480, 335)">
    <rect x="-210" y="-40" width="420" height="80" rx="16" fill="#EEF2FF" stroke="#4338CA" stroke-width="3.5"/>
    <text x="0" y="-8" font-family="Fraunces, serif" font-size="22" font-weight="600" fill="#4338CA" text-anchor="middle">Masked Self-Attention</text>
    <text x="0" y="18" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#5B5870" text-anchor="middle">Queries &#8226; Keys &#8226; Values &#8226; Attention Scores</text>
  </g>

  <!-- Attention Arcs -->
  <!-- Arc 1: from token 4 ("often") back to token 2 ("trains") -->
  <path d="M 640 470 C 640 400, 360 400, 360 470" fill="none" stroke="#4338CA" stroke-width="4" stroke-linecap="round"/>
  <!-- Arc 2: from token 4 ("often") back to token 1 ("Local") -->
  <path d="M 640 470 C 640 370, 220 370, 220 470" fill="none" stroke="#8B83FF" stroke-width="3" stroke-linecap="round" stroke-dasharray="8,6"/>

  <!-- Connection to Tokens -->
  <line x1="480" y1="375" x2="480" y2="445" stroke="#4338CA" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Bottom Row: Input Token Embeddings -->
  <g id="tokens" transform="translate(0, 500)">
    <!-- Token 1 -->
    <g transform="translate(220, 0)">
      <rect x="-55" y="-28" width="110" height="56" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="3"/>
      <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#1E1B2E" text-anchor="middle">Local</text>
      <circle cx="0" cy="-28" r="6" fill="#8B83FF"/>
    </g>
    <!-- Token 2 -->
    <g transform="translate(360, 0)">
      <rect x="-55" y="-28" width="110" height="56" rx="12" fill="#FFFFFF" stroke="#4338CA" stroke-width="3"/>
      <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#1E1B2E" text-anchor="middle">trains</text>
      <circle cx="0" cy="-28" r="6" fill="#4338CA"/>
    </g>
    <!-- Token 3 -->
    <g transform="translate(500, 0)">
      <rect x="-55" y="-28" width="110" height="56" rx="12" fill="#FFFFFF" stroke="#E5DFD3" stroke-width="3"/>
      <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#5B5870" text-anchor="middle">are</text>
    </g>
    <!-- Token 4 (Target) -->
    <g transform="translate(640, 0)">
      <rect x="-55" y="-28" width="110" height="56" rx="12" fill="#4338CA" stroke="#4338CA" stroke-width="3"/>
      <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">often</text>
      <circle cx="0" cy="-28" r="6" fill="#F4A62A"/>
    </g>
    <!-- Token 5 (Masked/Predicting) -->
    <g transform="translate(770, 0)">
      <rect x="-40" y="-28" width="80" height="56" rx="12" fill="none" stroke="#4338CA" stroke-width="3" stroke-dasharray="6,6"/>
      <text x="0" y="7" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" fill="#4338CA" text-anchor="middle">?</text>
    </g>
  </g>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="960" height="8" fill="#4338CA"/>
</svg>
