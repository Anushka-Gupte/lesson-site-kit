<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-label="Dhaba kitchen counter and vegetable market road beneath an algorithmic roofline boundary">
  <defs>
    <pattern id="rf-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.5" fill="#9A5205" opacity="0.12"/>
      <circle cx="0" cy="0" r="1" fill="#9A5205" opacity="0.08"/>
      <circle cx="32" cy="0" r="1" fill="#9A5205" opacity="0.08"/>
      <circle cx="0" cy="32" r="1" fill="#9A5205" opacity="0.08"/>
      <circle cx="32" cy="32" r="1" fill="#9A5205" opacity="0.08"/>
    </pattern>
    <linearGradient id="rf-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A5205" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#9A5205" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="640" fill="#FDFBF7"/>
  <rect width="960" height="640" fill="url(#rf-glow)"/>
  <rect width="960" height="640" fill="url(#rf-grid)"/>

  <!-- Outer Blueprint Frame -->
  <rect x="32" y="32" width="896" height="576" rx="20" fill="none" stroke="#EFE6D8" stroke-width="2"/>

  <!-- THE ROOFLINE (Dhaba Canopy) -->
  <!-- Roof shaded fill underneath the ceiling -->
  <polygon points="120,410 490,140 840,140 840,410" fill="#F4A62A" opacity="0.08"/>

  <!-- Sloped roofline (Memory-bound zone) -->
  <line x1="120" y1="410" x2="490" y2="140" stroke="#9A5205" stroke-width="6" stroke-linecap="round"/>
  <!-- Flat ceiling roofline (Compute-bound zone) -->
  <line x1="490" y1="140" x2="840" y2="140" stroke="#9A5205" stroke-width="6" stroke-linecap="round"/>

  <!-- Ridge Point (The Elbow where memory meets compute) -->
  <circle cx="490" cy="140" r="12" fill="#F4A62A" stroke="#9A5205" stroke-width="4"/>
  <rect x="420" y="85" width="140" height="34" rx="8" fill="#FFFFFF" stroke="#9A5205" stroke-width="2.5"/>
  <text x="490" y="107" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#9A5205" text-anchor="middle">Ridge = 247</text>

  <!-- Roof labels -->
  <!-- Memory Bound label -->
  <g transform="translate(250, 230) rotate(-36)">
    <rect x="-85" y="-18" width="170" height="32" rx="6" fill="#FFFFFF" stroke="#9A5205" stroke-width="2"/>
    <text x="0" y="4" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#9A5205" text-anchor="middle">Memory-Bound (Salad)</text>
  </g>
  <!-- Compute Bound label -->
  <g transform="translate(670, 105)">
    <rect x="-95" y="-18" width="190" height="32" rx="6" fill="#FFFFFF" stroke="#9A5205" stroke-width="2"/>
    <text x="0" y="4" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#9A5205" text-anchor="middle">Compute-Bound (Biryani)</text>
  </g>

  <!-- Left: Sabzi Mandi (DRAM Memory Store) -->
  <g transform="translate(180, 470)">
    <rect x="-80" y="-80" width="160" height="120" rx="14" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="3.5"/>
    <!-- Veg Sacks -->
    <ellipse cx="-35" cy="0" rx="28" ry="32" fill="#FAF5ED" stroke="#9A5205" stroke-width="3"/>
    <ellipse cx="35" cy="0" rx="28" ry="32" fill="#FAF5ED" stroke="#9A5205" stroke-width="3"/>
    <line x1="-35" y1="-28" x2="-35" y2="-20" stroke="#9A5205" stroke-width="3"/>
    <line x1="35" y1="-28" x2="35" y2="-20" stroke="#9A5205" stroke-width="3"/>
    <!-- Mandi Signboard -->
    <rect x="-70" y="-105" width="140" height="32" rx="8" fill="#1E1B2E"/>
    <text x="0" y="-84" font-family="Fraunces, serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Mandi (DRAM)</text>
    <text x="0" y="25" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#5B5870" text-anchor="middle">5.3 TB/s Bandwidth</text>
  </g>

  <!-- Middle: Road and Delivery Cycle (Memory Bus) -->
  <g transform="translate(450, 485)">
    <!-- Road Line -->
    <line x1="-180" y1="25" x2="180" y2="25" stroke="#E7E1D6" stroke-width="12" stroke-linecap="round"/>
    <line x1="-160" y1="25" x2="160" y2="25" stroke="#9A5205" stroke-width="3" stroke-dasharray="14,10"/>
    <!-- Helper Cycle -->
    <circle cx="-25" cy="10" r="16" fill="none" stroke="#9A5205" stroke-width="3"/>
    <circle cx="25" cy="10" r="16" fill="none" stroke="#9A5205" stroke-width="3"/>
    <line x1="-25" y1="10" x2="0" y2="0" stroke="#1E1B2E" stroke-width="3"/>
    <line x1="0" y1="0" x2="25" y2="10" stroke="#1E1B2E" stroke-width="3"/>
    <line x1="0" y1="0" x2="-8" y2="-15" stroke="#1E1B2E" stroke-width="3"/>
    <line x1="-15" y1="-15" x2="0" y2="-15" stroke="#1E1B2E" stroke-width="3"/>
    <rect x="5" y="-14" width="22" height="16" rx="3" fill="#F4A62A"/>
    <text x="0" y="-28" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#9A5205" text-anchor="middle">Bytes Moved / sec</text>
  </g>

  <!-- Right: Dhaba Kitchen (Compute Units) -->
  <g transform="translate(730, 470)">
    <rect x="-95" y="-80" width="190" height="120" rx="14" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="3.5"/>
    <!-- Handi / Copper Pot -->
    <path d="M-40 10 Q -45 35, 0 35 Q 45 35, 40 10 Z" fill="#F4A62A" stroke="#9A5205" stroke-width="3"/>
    <ellipse cx="0" cy="10" rx="40" ry="10" fill="#FFFFFF" stroke="#9A5205" stroke-width="3"/>
    <!-- Cook Cutting Knife -->
    <path d="M -20 -35 L 25 -25 L 20 -15 L -20 -25 Z" fill="#5B5870"/>
    <circle cx="0" cy="-45" r="14" fill="#FAF5ED" stroke="#9A5205" stroke-width="2.5"/>
    <!-- Signboard -->
    <rect x="-85" y="-105" width="170" height="32" rx="8" fill="#1E1B2E"/>
    <text x="0" y="-84" font-family="Fraunces, serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Kitchen (Compute)</text>
    <text x="0" y="25" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#5B5870" text-anchor="middle">1,307 TFLOP/s Peak</text>
  </g>

  <!-- Accent Bar Top -->
  <rect x="0" y="0" width="960" height="8" fill="#9A5205"/>
</svg>
