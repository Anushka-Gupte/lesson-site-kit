<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60" role="img" aria-hidden="true">
  <defs>
    <pattern id="roofPattern" width="200" height="60" patternUnits="userSpaceOnUse">
      <!-- Sloped Memory Diagonal -->
      <line x1="10" y1="45" x2="80" y2="15" stroke="#9A5205" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Flat Compute Roof -->
      <line x1="80" y1="15" x2="170" y2="15" stroke="#F4A62A" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Ridge Point Dot -->
      <circle cx="80" cy="15" r="4.5" fill="#FFFFFF" stroke="#9A5205" stroke-width="2"/>
      <!-- Subtle Ground Line -->
      <line x1="0" y1="52" x2="200" y2="52" stroke="#E7E1D6" stroke-width="1.5" stroke-dasharray="3,5"/>
    </pattern>
  </defs>
  <rect width="1200" height="60" fill="url(#roofPattern)"/>
</svg>
