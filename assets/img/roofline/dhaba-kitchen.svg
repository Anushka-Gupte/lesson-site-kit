<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Illustration of the Dhaba Kitchen metaphor comparing memory storage at the Mandi, road bandwidth, and compute power in the kitchen">
  <defs>
    <linearGradient id="dhabaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F3"/>
      <stop offset="100%" stop-color="#F5EFE6"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E7E1D6"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7E1D6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#dhabaBg)"/>
  <rect width="800" height="450" rx="16" fill="none" stroke="#E7E1D6" stroke-width="2"/>

  <!-- ================= TOP HALF: THE HARDWARE METAPHOR ================= -->

  <!-- Left: The Mandi (Memory) -->
  <g transform="translate(40, 40)">
    <rect width="210" height="190" rx="14" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="3"/>
    <rect width="210" height="42" rx="12" fill="#F4EDE2"/>
    <line x1="0" y1="42" x2="210" y2="42" stroke="#1E1B2E" stroke-width="2"/>
    <text x="105" y="27" font-family="'Fraunces', serif" font-size="16" font-weight="600" fill="#1E1B2E" text-anchor="middle">SABZI MANDI</text>

    <!-- Subtitle: Memory -->
    <rect x="35" y="52" width="140" height="24" rx="12" fill="#E7E1D6"/>
    <text x="105" y="68" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#5B5870" text-anchor="middle">MEMORY (BYTES)</text>

    <!-- Mandi Visual: Veggie crates & sacks -->
    <rect x="25" y="90" width="70" height="40" rx="6" fill="#FBF8F3" stroke="#9A5205" stroke-width="2"/>
    <circle cx="45" cy="110" r="7" fill="#F4A62A"/>
    <circle cx="65" cy="110" r="7" fill="#9A5205"/>
    <rect x="110" y="90" width="75" height="40" rx="6" fill="#FBF8F3" stroke="#9A5205" stroke-width="2"/>
    <circle cx="130" cy="110" r="7" fill="#F4A62A"/>
    <circle cx="155" cy="110" r="7" fill="#9A5205"/>

    <text x="105" y="156" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#5B5870" text-anchor="middle">All data starts here</text>
    <text x="105" y="174" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#9A5205" text-anchor="middle">Far from the cook</text>
  </g>

  <!-- Middle: The Road (Bandwidth) -->
  <g transform="translate(265, 40)">
    <!-- Road Track -->
    <rect x="0" y="55" width="270" height="90" rx="10" fill="url(#roadGrad)" stroke="#E7E1D6" stroke-width="2"/>
    <line x1="10" y1="100" x2="260" y2="100" stroke="#9A5205" stroke-width="2.5" stroke-dasharray="8,8"/>

    <!-- Arrow from Mandi to Kitchen -->
    <path d="M 30 75 L 235 75" fill="none" stroke="#9A5205" stroke-width="3" stroke-linecap="round"/>
    <polygon points="242,75 230,70 230,80" fill="#9A5205"/>

    <!-- The Cycle Helper -->
    <g transform="translate(100, 75)">
      <circle cx="15" cy="40" r="12" fill="none" stroke="#1E1B2E" stroke-width="2.5"/>
      <circle cx="55" cy="40" r="12" fill="none" stroke="#1E1B2E" stroke-width="2.5"/>
      <polyline points="15,40 35,25 55,40" fill="none" stroke="#1E1B2E" stroke-width="2.5"/>
      <polyline points="35,25 35,10 45,10" fill="none" stroke="#1E1B2E" stroke-width="2.5"/>
      <rect x="42" y="12" width="18" height="15" rx="3" fill="#F4A62A" stroke="#1E1B2E" stroke-width="1.5"/>
    </g>

    <!-- Bandwidth Label -->
    <rect x="25" y="10" width="220" height="32" rx="16" fill="#1E1B2E"/>
    <text x="135" y="31" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F4A62A" text-anchor="middle">THE HELPER'S ROAD</text>
    <text x="135" y="165" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#9A5205" text-anchor="middle">Bandwidth: Bytes / second</text>
  </g>

  <!-- Right: Dhaba Kitchen (Compute Units) -->
  <g transform="translate(550, 40)">
    <rect width="210" height="190" rx="14" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="3"/>
    <rect width="210" height="42" rx="12" fill="#F4EDE2"/>
    <line x1="0" y1="42" x2="210" y2="42" stroke="#1E1B2E" stroke-width="2"/>
    <text x="105" y="27" font-family="'Fraunces', serif" font-size="16" font-weight="600" fill="#1E1B2E" text-anchor="middle">DHABA KITCHEN</text>

    <!-- Subtitle: Compute -->
    <rect x="30" y="52" width="150" height="24" rx="12" fill="#E7E1D6"/>
    <text x="105" y="68" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#5B5870" text-anchor="middle">COMPUTE (FLOP/S)</text>

    <!-- Kitchen Visual: Cutting board & lightning speed knife -->
    <rect x="45" y="95" width="120" height="32" rx="6" fill="#FBF8F3" stroke="#1E1B2E" stroke-width="2"/>
    <path d="M 65 90 L 85 105 L 75 115" fill="none" stroke="#9A5205" stroke-width="3" stroke-linecap="round"/>
    <path d="M 120 90 L 140 105 L 130 115" fill="none" stroke="#9A5205" stroke-width="3" stroke-linecap="round"/>

    <text x="105" y="156" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#5B5870" text-anchor="middle">Incredibly fast cook</text>
    <text x="105" y="174" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#9A5205" text-anchor="middle">1,000 chops / minute</text>
  </g>

  <!-- ================= BOTTOM HALF: THE TWO RECIPES ================= -->

  <!-- Recipe 1: Salad -->
  <g transform="translate(40, 255)">
    <rect width="345" height="155" rx="12" fill="#FFFFFF" stroke="#9A5205" stroke-width="2.5"/>
    <rect width="345" height="36" rx="10" fill="#FDF3E7"/>
    <line x1="0" y1="36" x2="345" y2="36" stroke="#9A5205" stroke-width="1.5"/>

    <text x="20" y="24" font-family="'Fraunces', serif" font-size="16" font-weight="600" fill="#9A5205">Recipe A: Fresh Salad</text>
    <text x="325" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#5B5870" text-anchor="end">Low Intensity</text>

    <text x="20" y="65" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#1E1B2E">&#8226; 1 chop per vegetable fetched from Mandi.</text>
    <text x="20" y="90" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#1E1B2E">&#8226; Cook chops instantly, then waits idly.</text>

    <!-- Badge -->
    <rect x="20" y="110" width="305" height="32" rx="6" fill="#F4EDE2"/>
    <text x="172" y="131" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#9A5205" text-anchor="middle">BOTTLENECK: The Helper (Memory-Bound)</text>
  </g>

  <!-- Recipe 2: Dum Biryani -->
  <g transform="translate(415, 255)">
    <rect width="345" height="155" rx="12" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="2.5"/>
    <rect width="345" height="36" rx="10" fill="#F4EDE2"/>
    <line x1="0" y1="36" x2="345" y2="36" stroke="#1E1B2E" stroke-width="1.5"/>

    <text x="20" y="24" font-family="'Fraunces', serif" font-size="16" font-weight="600" fill="#1E1B2E">Recipe B: Slow Dum Biryani</text>
    <text x="325" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#5B5870" text-anchor="end">High Intensity</text>

    <text x="20" y="65" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#1E1B2E">&#8226; Helper brings ingredients once.</text>
    <text x="20" y="90" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#1E1B2E">&#8226; Cook chops, marinates, simmers for hours.</text>

    <!-- Badge -->
    <rect x="20" y="110" width="305" height="32" rx="6" fill="#1E1B2E"/>
    <text x="172" y="131" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F4A62A" text-anchor="middle">BOTTLENECK: The Cook (Compute-Bound)</text>
  </g>
</svg>
