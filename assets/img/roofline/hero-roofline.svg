<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Architectural roofline plot showing the slope of memory bandwidth meeting the flat ceiling of peak compute above a bustling dhaba kitchen">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F3"/>
      <stop offset="100%" stop-color="#F4EDE2"/>
    </linearGradient>

    <!-- Saffron Accent Gradient -->
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A5205"/>
      <stop offset="100%" stop-color="#F4A62A"/>
    </linearGradient>

    <!-- Shading Gradients under the Roof -->
    <linearGradient id="memAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9A5205" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#9A5205" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="compAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4A62A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F4A62A" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Dot Texture Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#E7E1D6"/>
    </pattern>

    <!-- Card Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E1B2E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  <rect width="1600" height="900" fill="url(#dotGrid)" opacity="0.65"/>

  <!-- Subtle Coordinate Grid Lines (Log-Log Decades) -->
  <g stroke="#E7E1D6" stroke-width="1.5" stroke-dasharray="4,6">
    <line x1="160" y1="240" x2="1480" y2="240"/>
    <line x1="160" y1="410" x2="1480" y2="410"/>
    <line x1="160" y1="580" x2="1480" y2="580"/>

    <line x1="420" y1="120" x2="420" y2="750"/>
    <line x1="680" y1="120" x2="680" y2="750"/>
    <line x1="880" y1="120" x2="880" y2="750"/>
    <line x1="1180" y1="120" x2="1180" y2="750"/>
  </g>

  <!-- Shaded Regions under the Roofline -->
  <!-- Memory Bound Area (Diagonal Polygon) -->
  <polygon points="240,750 240,690 880,240 880,750" fill="url(#memAreaGrad)"/>
  <!-- Compute Bound Area (Flat Rectangle Polygon) -->
  <polygon points="880,750 880,240 1460,240 1460,750" fill="url(#compAreaGrad)"/>

  <!-- Main Roofline Geometry -->
  <!-- Memory Slope -->
  <line x1="240" y1="690" x2="880" y2="240" stroke="#9A5205" stroke-width="8" stroke-linecap="round"/>
  <!-- Compute Ceiling -->
  <line x1="880" y1="240" x2="1460" y2="240" stroke="#F4A62A" stroke-width="8" stroke-linecap="round"/>

  <!-- Vertical Ridge Line -->
  <line x1="880" y1="240" x2="880" y2="750" stroke="#9A5205" stroke-width="3" stroke-dasharray="8,8"/>

  <!-- Ridge Corner Highlight Dots -->
  <circle cx="880" cy="240" r="14" fill="#FFFFFF" stroke="#9A5205" stroke-width="5"/>
  <circle cx="880" cy="240" r="6" fill="#F4A62A"/>

  <!-- Dotted connector line from Ridge Badge to Ridge Corner -->
  <line x1="880" y1="165" x2="880" y2="224" stroke="#1E1B2E" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Ridge Point Badge (Top, Centered Above Corner) -->
  <g transform="translate(880, 136)">
    <rect x="-115" y="-27" width="230" height="54" rx="14" fill="#1E1B2E" filter="url(#cardShadow)"/>
    <text x="0" y="-4" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#F4A62A" text-anchor="middle" letter-spacing="0.05em">RIDGE POINT</text>
    <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#FBF8F3" text-anchor="middle">I = Peak / Bandwidth</text>
  </g>

  <!-- Ceiling Label (Above Compute Roof) -->
  <g transform="translate(1170, 182)">
    <rect x="-135" y="-22" width="270" height="44" rx="8" fill="#FFFFFF" stroke="#F4A62A" stroke-width="2.5" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="'Fraunces', serif" font-size="16" font-weight="600" fill="#9A5205" text-anchor="middle">Peak Compute Roof (P)</text>
  </g>

  <!-- Slope Label (Parallel & Above Diagonal Line) -->
  <g transform="translate(480, 395) rotate(-35)">
    <rect x="-140" y="-22" width="280" height="44" rx="8" fill="#FFFFFF" stroke="#9A5205" stroke-width="2.5" filter="url(#cardShadow)"/>
    <text x="0" y="6" font-family="'Fraunces', serif" font-size="16" font-weight="600" fill="#9A5205" text-anchor="middle">Bandwidth &#215; Intensity</text>
  </g>

  <!-- ================= LEFT THEMATIC CARD: MEMORY-BOUND & MANDI ================= -->
  <!-- Positioned safely inside the lower memory-bound trapezoid (X: 490..810, Y: 520..710) -->
  <g transform="translate(490, 520)" filter="url(#cardShadow)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="330" height="190" rx="14" fill="#FFFFFF" stroke="#9A5205" stroke-width="2"/>
    <rect x="0" y="0" width="330" height="36" rx="12" fill="#FDF3E7"/>
    <line x1="0" y1="36" x2="330" y2="36" stroke="#9A5205" stroke-width="1.5"/>

    <!-- Header Text -->
    <text x="165" y="24" font-family="'Fraunces', serif" font-size="16" font-weight="600" fill="#9A5205" text-anchor="middle">Memory-Bound Region</text>

    <!-- Subtitle -->
    <text x="165" y="58" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#1E1B2E" text-anchor="middle">Waiting on the Helper (Low Intensity)</text>

    <!-- Visual: Mandi Crate + Cycle Helper -->
    <g transform="translate(40, 75)">
      <!-- Mandi Sacks / Crate -->
      <rect x="0" y="10" width="60" height="35" rx="6" fill="#FBF8F3" stroke="#9A5205" stroke-width="2"/>
      <circle cx="18" cy="28" r="6" fill="#F4A62A"/>
      <circle cx="36" cy="28" r="6" fill="#9A5205"/>
      <text x="30" y="58" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#5B5870" text-anchor="middle">Mandi</text>

      <!-- Flow Arrow -->
      <path d="M 75 28 L 115 28" fill="none" stroke="#9A5205" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="120,28 110,23 110,33" fill="#9A5205"/>
      <text x="95" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9A5205" text-anchor="middle">Bytes</text>

      <!-- Cycle Helper -->
      <g transform="translate(145, 0)">
        <circle cx="15" cy="30" r="13" fill="none" stroke="#1E1B2E" stroke-width="2.5"/>
        <circle cx="55" cy="30" r="13" fill="none" stroke="#1E1B2E" stroke-width="2.5"/>
        <polyline points="15,30 35,16 55,30" fill="none" stroke="#1E1B2E" stroke-width="2.5"/>
        <polyline points="35,16 35,4 45,4" fill="none" stroke="#1E1B2E" stroke-width="2.5"/>
        <rect x="42" y="5" width="16" height="13" rx="3" fill="#F4A62A" stroke="#1E1B2E" stroke-width="1.5"/>
        <text x="35" y="58" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#5B5870" text-anchor="middle">Helper</text>
      </g>
    </g>

    <!-- Explanatory Footer -->
    <text x="165" y="172" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#5B5870" text-anchor="middle">Cook chops instantly, then waits for next delivery</text>
  </g>

  <!-- ================= RIGHT THEMATIC CARD: COMPUTE-BOUND & DHABA KITCHEN ================= -->
  <!-- Positioned safely inside the large compute-bound rectangle (X: 990..1370, Y: 430..690) -->
  <g transform="translate(980, 430)" filter="url(#cardShadow)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="370" height="230" rx="14" fill="#FFFFFF" stroke="#F4A62A" stroke-width="2.5"/>
    <rect x="0" y="0" width="370" height="38" rx="12" fill="#F4EDE2"/>
    <line x1="0" y1="38" x2="370" y2="38" stroke="#1E1B2E" stroke-width="1.5"/>

    <!-- Header Text -->
    <text x="185" y="25" font-family="'Fraunces', serif" font-size="16" font-weight="600" fill="#1E1B2E" text-anchor="middle">Compute-Bound Region</text>

    <!-- Subtitle -->
    <text x="185" y="62" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#9A5205" text-anchor="middle">Using the Whole Chip (High Intensity)</text>

    <!-- Visual: Dhaba Kitchen Counter & Fast Cook -->
    <g transform="translate(50, 80)">
      <!-- Kitchen Counter -->
      <rect x="0" y="20" width="270" height="40" rx="8" fill="#FBF8F3" stroke="#1E1B2E" stroke-width="2"/>
      <line x1="10" y1="35" x2="260" y2="35" stroke="#E7E1D6" stroke-width="1.5"/>

      <!-- Fast Chopping Knife -->
      <path d="M 45 10 L 70 30 L 60 40" fill="none" stroke="#9A5205" stroke-width="3" stroke-linecap="round"/>
      <path d="M 85 10 L 110 30 L 100 40" fill="none" stroke="#9A5205" stroke-width="3" stroke-linecap="round"/>
      <text x="80" y="78" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#5B5870" text-anchor="middle">1,000 chops / min</text>

      <!-- Simmering Kadai / Dum Handi -->
      <path d="M 175 35 Q 210 58 245 35 Z" fill="#9A5205" stroke="#1E1B2E" stroke-width="2"/>
      <path d="M 195 35 Q 210 18 225 35 Z" fill="#F4A62A"/>
      <text x="210" y="78" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#5B5870" text-anchor="middle">Dum Biryani</text>
    </g>

    <!-- Explanatory Footer -->
    <text x="185" y="195" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#5B5870" text-anchor="middle">Ingredients already on hand; cook works at peak</text>
    <text x="185" y="214" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#9A5205" text-anchor="middle">Speed = Peak Compute (1,307 TFLOP/s)</text>
  </g>

  <!-- Coordinate Axes & Baseline -->
  <line x1="140" y1="750" x2="1500" y2="750" stroke="#1E1B2E" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="160" y1="770" x2="160" y2="120" stroke="#1E1B2E" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Axis Arrows -->
  <polyline points="152,132 160,116 168,132" fill="none" stroke="#1E1B2E" stroke-width="3.5" stroke-linecap="round"/>
  <polyline points="1488,742 1504,750 1488,758" fill="none" stroke="#1E1B2E" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Axis Titles -->
  <text x="1500" y="785" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#1E1B2E" text-anchor="end">Arithmetic Intensity (FLOPs / byte) &#8594;</text>
  <text x="150" y="90" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#1E1B2E" text-anchor="start">&#8593; Attainable Speed (FLOP/s)</text>
</svg>
