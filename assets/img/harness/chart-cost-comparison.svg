<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440" role="img" aria-label="Comparison chart of measured fixed prompt cost per turn: Pi at 5,251 characters versus Hermes Agent at 53,714 characters">
  <defs>
    <pattern id="chart-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#0F766E" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="840" height="440" rx="16" fill="#FFFFFF"/>
  <rect width="840" height="440" rx="16" fill="url(#chart-dots)"/>
  <rect x="1.5" y="1.5" width="837" height="437" rx="15" fill="none" stroke="#E7E1D6" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#0F766E">MEASURED FIXED COST PER TURN</text>
    <text x="0" y="28" font-family="Fraunces, serif" font-size="24" font-weight="600" fill="#1E1B2E">Context Burden Before You Type a Single Word</text>
  </g>

  <!-- Legend -->
  <g transform="translate(480, 42)">
    <rect x="0" y="4" width="16" height="16" rx="4" fill="#0F766E"/>
    <text x="24" y="17" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#1E1B2E">System Prompt</text>
    <rect x="150" y="4" width="16" height="16" rx="4" fill="#F4A62A"/>
    <text x="174" y="17" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#1E1B2E">Tool Schemas</text>
  </g>

  <!-- Chart Grid Lines -->
  <g transform="translate(180, 120)">
    <!-- Scale: 0 to 60k chars. Width = 580px -> ~0.00966 px/char -->
    <!-- 0k = 0px, 15k = 145px, 30k = 290px, 45k = 435px, 60k = 580px -->
    <line x1="0" y1="0" x2="0" y2="210" stroke="#E7E1D6" stroke-width="2"/>
    <line x1="145" y1="0" x2="145" y2="210" stroke="#E7E1D6" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="290" y1="0" x2="290" y2="210" stroke="#E7E1D6" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="435" y1="0" x2="435" y2="210" stroke="#E7E1D6" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="580" y1="0" x2="580" y2="210" stroke="#E7E1D6" stroke-width="2"/>

    <!-- Axis Labels -->
    <text x="0" y="235" font-family="'JetBrains Mono', monospace" font-size="14" fill="#5B5870" text-anchor="middle">0</text>
    <text x="145" y="235" font-family="'JetBrains Mono', monospace" font-size="14" fill="#5B5870" text-anchor="middle">15k</text>
    <text x="290" y="235" font-family="'JetBrains Mono', monospace" font-size="14" fill="#5B5870" text-anchor="middle">30k</text>
    <text x="435" y="235" font-family="'JetBrains Mono', monospace" font-size="14" fill="#5B5870" text-anchor="middle">45k</text>
    <text x="580" y="235" font-family="'JetBrains Mono', monospace" font-size="14" fill="#5B5870" text-anchor="middle">60k chars</text>
  </g>

  <!-- Bar 1: Pi 1.5.2 -->
  <g transform="translate(40, 140)">
    <text x="120" y="26" font-family="Fraunces, serif" font-size="18" font-weight="600" fill="#1E1B2E" text-anchor="end">Pi 1.5.2</text>
    <text x="120" y="46" font-family="Inter, sans-serif" font-size="14" fill="#5B5870" text-anchor="end">4 tools</text>

    <!-- Bar container (starts at x=140) -->
    <!-- Prompt: 2,295 chars = ~22px. Tool: 2,956 chars = ~29px. Total = 51px (min visual width 52px) -->
    <rect x="140" y="6" width="22" height="48" rx="6" fill="#0F766E"/>
    <rect x="162" y="6" width="30" height="48" rx="6" fill="#F4A62A"/>

    <!-- Total Label -->
    <text x="205" y="28" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#0F766E">5,251 chars</text>
    <text x="205" y="47" font-family="Inter, sans-serif" font-size="14" fill="#5B5870">(~1,312 tokens)</text>
  </g>

  <!-- Bar 2: Hermes Agent 0.19.0 -->
  <g transform="translate(40, 235)">
    <text x="120" y="26" font-family="Fraunces, serif" font-size="18" font-weight="600" fill="#1E1B2E" text-anchor="end">Hermes Agent</text>
    <text x="120" y="46" font-family="Inter, sans-serif" font-size="14" fill="#5B5870" text-anchor="end">27 tools default</text>

    <!-- Prompt: 6,634 chars = ~64px. Tool schemas: 47,080 chars = ~455px. Total = 519px -->
    <rect x="140" y="6" width="64" height="48" rx="6" fill="#0F766E"/>
    <rect x="204" y="6" width="455" height="48" rx="6" fill="#F4A62A"/>

    <!-- Inner / Total Label -->
    <text x="670" y="28" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#1E1B2E">53,714 chars</text>
    <text x="670" y="47" font-family="Inter, sans-serif" font-size="14" fill="#5B5870">(~13,428 tokens)</text>
  </g>

  <!-- Bottom Insight / Ratio Callout -->
  <g transform="translate(40, 385)">
    <rect x="0" y="0" width="760" height="34" rx="8" fill="#F4F8F7" stroke="#D3E5E3" stroke-width="1.5"/>
    <text x="20" y="22" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0F766E">Ratio: Hermes sends ~10.2&#215; more characters per request than Pi</text>
    <text x="470" y="22" font-family="Inter, sans-serif" font-size="14" fill="#5B5870">Prompt: 6.6k vs 2.3k &#183; Tools: 47k vs 3.0k</text>
  </g>
</svg>