<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="A brilliant person locked inside a soundproof glass room, sliding notes under the door but unable to touch files or run commands">
  <defs>
    <linearGradient id="glass-tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#0F766E" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="glass-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#0F766E" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="20" fill="#F4F8F7"/>
  <rect width="800" height="480" rx="20" fill="url(#glass-dots)"/>
  <rect x="2" y="2" width="796" height="476" rx="18" fill="none" stroke="#D3E5E3" stroke-width="2"/>

  <!-- Left: The Glass Room Chamber -->
  <g transform="translate(60, 50)">
    <!-- Glass Chamber Walls -->
    <rect x="0" y="0" width="360" height="360" rx="16" fill="url(#glass-tint)" stroke="#0F766E" stroke-width="4"/>
    <!-- Glass reflection diagonal line -->
    <line x1="30" y1="20" x2="160" y2="340" stroke="#FFFFFF" stroke-width="8" opacity="0.4" stroke-linecap="round"/>
    <line x1="60" y1="20" x2="175" y2="280" stroke="#FFFFFF" stroke-width="4" opacity="0.3" stroke-linecap="round"/>

    <!-- Room Header -->
    <rect x="20" y="20" width="170" height="28" rx="6" fill="#0F766E"/>
    <text x="105" y="39" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">THE GLASS ROOM</text>

    <!-- Inside: The Brilliant Thinker (Model) -->
    <g transform="translate(180, 190)">
      <!-- Head / Lightbulb of intelligence -->
      <circle cx="0" cy="-60" r="32" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="4"/>
      <!-- Glasses / Thinking face -->
      <circle cx="-10" cy="-60" r="8" fill="none" stroke="#0F766E" stroke-width="3"/>
      <circle cx="10" cy="-60" r="8" fill="none" stroke="#0F766E" stroke-width="3"/>
      <line x1="-2" y1="-60" x2="2" y2="-60" stroke="#0F766E" stroke-width="3"/>
      <!-- Body -->
      <path d="M -40 20 C -40 -20, 40 -20, 40 20 Z" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="4"/>
      <!-- Desk -->
      <rect x="-90" y="20" width="180" height="12" rx="4" fill="#1E1B2E"/>
      <!-- Notepad (Text In / Text Out) -->
      <rect x="-35" y="-10" width="70" height="34" rx="4" fill="#FBF8F3" stroke="#0F766E" stroke-width="2.5"/>
      <line x1="-25" y1="0" x2="15" y2="0" stroke="#0F766E" stroke-width="2"/>
      <line x1="-25" y1="8" x2="25" y2="8" stroke="#0F766E" stroke-width="2"/>
      <line x1="-25" y1="16" x2="5" y2="16" stroke="#0F766E" stroke-width="2"/>
      <!-- Label -->
      <text x="0" y="65" font-family="Fraunces, serif" font-size="16" font-weight="600" fill="#0F766E" text-anchor="middle">Raw Language Model</text>
      <text x="0" y="85" font-family="Inter, sans-serif" font-size="14" fill="#5B5870" text-anchor="middle">Brilliant &amp; completely isolated</text>
    </g>

    <!-- Slit under the door at bottom right -->
    <rect x="300" y="340" width="60" height="20" fill="#1E1B2E"/>
    <rect x="305" y="348" width="50" height="4" fill="#F4A62A"/>
  </g>

  <!-- Middle: The Door Slit & Passing Notes -->
  <g transform="translate(420, 270)">
    <!-- Prompt sliding in -->
    <g transform="translate(0, -60)">
      <path d="M 120 0 L 20 0" fill="none" stroke="#0F766E" stroke-width="3" stroke-dasharray="6,4"/>
      <polygon points="10,0 25,-6 25,6" fill="#0F766E"/>
      <rect x="30" y="-32" width="130" height="24" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
      <text x="95" y="-16" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#0F766E" text-anchor="middle">"Fix my bug"</text>
    </g>
    <!-- Response sliding out -->
    <g transform="translate(0, 70)">
      <path d="M 20 0 L 120 0" fill="none" stroke="#1E1B2E" stroke-width="3" stroke-dasharray="6,4"/>
      <polygon points="130,0 115,-6 115,6" fill="#1E1B2E"/>
      <rect x="30" y="10" width="130" height="24" rx="6" fill="#FFFFFF" stroke="#1E1B2E" stroke-width="2"/>
      <text x="95" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#1E1B2E" text-anchor="middle">"Here is advice"</text>
    </g>
  </g>

  <!-- Right: What the Model CANNOT Do Alone (The Missing Harness) -->
  <g transform="translate(560, 60)">
    <text x="0" y="24" font-family="Fraunces, serif" font-size="20" font-weight="600" fill="#1E1B2E">What is missing?</text>
    <text x="0" y="46" font-family="Inter, sans-serif" font-size="14" fill="#5B5870">Three things the glass room lacks:</text>

    <!-- Item 1: Hands -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#E7E1D6" stroke-width="2"/>
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#FEE2E2"/>
      <text x="30" y="36" font-family="Inter, sans-serif" font-size="18" fill="#DC2626" text-anchor="middle">&#10005;</text>
      <text x="58" y="32" font-family="Fraunces, serif" font-size="16" font-weight="600" fill="#1E1B2E">No Hands</text>
      <text x="58" y="52" font-family="Inter, sans-serif" font-size="14" fill="#5B5870">Cannot open files or run</text>
    </g>

    <!-- Item 2: Memory -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#E7E1D6" stroke-width="2"/>
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#FEE2E2"/>
      <text x="30" y="36" font-family="Inter, sans-serif" font-size="18" fill="#DC2626" text-anchor="middle">&#10005;</text>
      <text x="58" y="32" font-family="Fraunces, serif" font-size="16" font-weight="600" fill="#1E1B2E">No Memory</text>
      <text x="58" y="52" font-family="Inter, sans-serif" font-size="14" fill="#5B5870">Forgets when you leave</text>
    </g>

    <!-- Item 3: Brakes -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#E7E1D6" stroke-width="2"/>
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#FEE2E2"/>
      <text x="30" y="36" font-family="Inter, sans-serif" font-size="18" fill="#DC2626" text-anchor="middle">&#10005;</text>
      <text x="58" y="32" font-family="Fraunces, serif" font-size="16" font-weight="600" fill="#1E1B2E">No Brakes</text>
      <text x="58" y="52" font-family="Inter, sans-serif" font-size="14" fill="#5B5870">Nobody to stop bad code</text>
    </g>

    <!-- Bottom summary tag -->
    <g transform="translate(0, 325)">
      <rect x="0" y="0" width="200" height="42" rx="8" fill="#0F766E"/>
      <text x="100" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">HARNESS GIVES ALL 3</text>
    </g>
  </g>
</svg>